<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
      /* 1. Design tokens — neon (dark-first) */
      :root {
        color-scheme: light dark;

        --color-bg-1: #e8ebff;
        --color-bg-2: #f5f3ff;
        --color-surface: #ffffff;
        --color-border: #d9dcf3;
        --color-text: #10152b;
        --color-text-muted: #4b5170;
        --color-accent: #7c3aed;
        --color-accent-hover: #db2777;
        --color-accent-contrast: #0a0614;
        --color-accent-halo: rgb(124 58 237 / 0.16);
        --color-accent-soft: rgb(0 240 255 / 0.1);
        --color-accent-ring: rgb(124 58 237 / 0.3);
        --color-accent-glow: rgb(255 43 214 / 0.35);
        --color-danger: #e11d48;
        --color-danger-soft: rgb(225 29 72 / 0.12);
        --color-focus: #7c3aed;

        /* Neon palette */
        --neon-cyan: #00f0ff;
        --neon-magenta: #ff2bd6;
        --neon-purple: #a855f7;
        --neon-lime: #b6ff3d;
        --neon-danger: #ff3b6b;
        --neon-glow-cyan: rgb(0 240 255 / 0.55);
        --neon-glow-magenta: rgb(255 43 214 / 0.55);
        --neon-glow-purple: rgb(168 85 247 / 0.5);
        --neon-border: rgb(0 240 255 / 0.35);

        --radius-card: 16px;
        --radius-control: 10px;
        --radius-row: 10px;

        --shadow-card:
          0 0 0 1px rgb(255 255 255 / 0.7) inset,
          0 1px 2px rgb(15 23 42 / 0.06),
          0 0 22px rgb(124 58 237 / 0.22),
          0 8px 30px rgb(15 23 42 / 0.1);
        --shadow-accent:
          0 0 0 1px rgb(255 255 255 / 0.25) inset,
          0 1px 2px rgb(124 58 237 / 0.4),
          0 0 16px var(--neon-glow-cyan),
          0 4px 14px rgb(255 43 214 / 0.35);

        --space-1: 0.5rem;
        --space-2: 0.75rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2rem;

        --speed: 150ms;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg-1: #05010d;
          --color-bg-2: #0a0618;
          --color-surface: rgb(20 10 40 / 0.72);
          --color-border: rgb(0 240 255 / 0.18);
          --color-text: #eaf6ff;
          --color-text-muted: #9aa7c7;
          --color-accent: #00f0ff;
          --color-accent-hover: #ff2bd6;
          --color-accent-contrast: #05010d;
          --color-accent-halo: rgb(0 240 255 / 0.14);
          --color-accent-soft: rgb(0 240 255 / 0.1);
          --color-accent-ring: rgb(0 240 255 / 0.35);
          --color-accent-glow: rgb(0 240 255 / 0.45);
          --color-danger: #ff3b6b;
          --color-danger-soft: rgb(255 59 107 / 0.16);
          --color-focus: #00f0ff;

          --shadow-card:
            0 0 0 1px rgb(0 240 255 / 0.14) inset,
            0 0 24px rgb(0 240 255 / 0.16),
            0 0 60px rgb(168 85 247 / 0.18),
            0 18px 50px rgb(0 0 0 / 0.6);
          --shadow-accent:
            0 0 0 1px rgb(255 255 255 / 0.2) inset,
            0 0 16px var(--neon-glow-cyan),
            0 0 34px var(--neon-glow-magenta),
            0 4px 14px rgb(0 0 0 / 0.5);
        }

        body {
          background:
            radial-gradient(
              60rem 60rem at 120% -10%,
              rgb(255 43 214 / 0.22),
              transparent 60%
            ),
            radial-gradient(
              42rem 42rem at -10% 110%,
              rgb(0 240 255 / 0.2),
              transparent 60%
            ),
            repeating-linear-gradient(
              0deg,
              rgb(0 240 255 / 0.08) 0 1px,
              transparent 1px 44px
            ),
            repeating-linear-gradient(
              90deg,
              rgb(0 240 255 / 0.08) 0 1px,
              transparent 1px 44px
            ),
            linear-gradient(160deg, var(--color-bg-1), var(--color-bg-2));
          text-shadow: 0 0 18px rgb(0 240 255 / 0.14);
        }
      }

      /* 2. Reset / base */
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: var(--space-5) var(--space-3);
        display: grid;
        place-items: start center;
        background:
          radial-gradient(
            60rem 60rem at 120% -10%,
            var(--color-accent-halo),
            transparent 60%
          ),
          radial-gradient(
            40rem 40rem at -10% 110%,
            rgb(255 43 214 / 0.14),
            transparent 60%
          ),
          radial-gradient(
            28rem 28rem at 50% -5%,
            rgb(0 240 255 / 0.12),
            transparent 70%
          ),
          repeating-linear-gradient(
            0deg,
            rgb(0 240 255 / 0.06) 0 1px,
            transparent 1px 44px
          ),
          repeating-linear-gradient(
            90deg,
            rgb(0 240 255 / 0.06) 0 1px,
            transparent 1px 44px
          ),
          linear-gradient(160deg, var(--color-bg-1), var(--color-bg-2));
        background-attachment: fixed;
        color: var(--color-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* 3. Layout: shell, card, header */
      .app-card {
        width: 100%;
        max-width: 480px;
        margin-top: var(--space-5);
        padding: var(--space-4);
        background: var(--color-surface);
        border: 1px solid var(--neon-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card), 0 0 40px var(--neon-glow-purple);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        animation: neon-pulse 6s ease-in-out infinite alternate;
      }

      header {
        margin-bottom: var(--space-3);
      }

      h1 {
        margin: 0 0 var(--space-1);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(
          90deg,
          var(--neon-cyan),
          var(--neon-magenta),
          var(--neon-purple)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 8px var(--neon-glow-cyan));
        animation: neon-sheen 5s ease-in-out infinite alternate;
      }

      .subtitle {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 0.875rem;
      }

      /* 4. Form controls */
      #todo-form {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
      }

      #todo-input {
        flex: 1 1 16rem;
        min-width: 0;
        padding: 0.6rem var(--space-3);
        background: var(--color-bg-2);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        font: inherit;
        transition:
          border-color var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      #todo-input::placeholder {
        color: var(--color-text-muted);
      }

      #add-btn {
        padding: 0.6rem 1rem;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
        color: var(--color-accent-contrast);
        border: none;
        border-radius: var(--radius-control);
        box-shadow: var(--shadow-accent), 0 0 18px var(--neon-glow-cyan);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform var(--speed) ease,
          box-shadow var(--speed) ease,
          filter var(--speed) ease;
      }

      #add-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: var(--shadow-accent), 0 0 28px var(--neon-glow-magenta);
      }

      #add-btn:active {
        transform: translateY(0);
        filter: brightness(0.96);
        box-shadow: var(--shadow-accent);
      }

      /* 5. Todo list & items */
      #todo-list {
        margin: var(--space-2) 0 0;
        padding: 0;
        list-style: none;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-1);
        border-radius: var(--radius-row);
        border-bottom: 1px solid var(--color-border);
        border-left: 3px solid transparent;
        transition:
          background-color var(--speed) ease,
          box-shadow var(--speed) ease,
          border-color var(--speed) ease;
      }

      .todo-item:hover {
        background: var(--color-accent-soft);
        border-left-color: var(--neon-cyan);
        box-shadow: inset 0 0 18px rgb(0 240 255 / 0.12);
      }

      .todo-item:last-child {
        border-bottom: none;
      }

      .todo-checkbox {
        flex-shrink: 0;
        width: 1.2rem;
        height: 1.2rem;
        margin: 0;
        accent-color: var(--neon-cyan);
        cursor: pointer;
        transition:
          transform var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      .todo-checkbox:checked {
        transform: scale(1.1);
        box-shadow: 0 0 10px var(--neon-glow-cyan);
      }

      .todo-text {
        flex: 1;
        min-width: 0;
        word-break: break-word;
        transition: opacity var(--speed) ease;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        text-decoration-color: var(--neon-magenta);
        text-decoration-thickness: 2px;
        color: var(--color-text-muted);
        opacity: 0.9;
      }

      .delete-btn {
        flex-shrink: 0;
        width: 2rem;
        height: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        color: var(--color-text-muted);
        border: none;
        border-radius: 50%;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        transition:
          color var(--speed) ease,
          background-color var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      .delete-btn:hover {
        background: var(--color-danger-soft);
        color: var(--color-danger);
        box-shadow: 0 0 12px var(--neon-danger);
      }

      /* 6. Empty state (pure CSS — the <ul> stays whitespace-free) */
      #todo-list:empty {
        margin: 0;
      }

      #todo-list:empty::after {
        content: "No todos yet — add one above ✨";
        display: block;
        padding: var(--space-4) var(--space-1);
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.875rem;
        border: 1px dashed var(--neon-border);
        border-radius: var(--radius-control);
        box-shadow: inset 0 0 24px rgb(0 240 255 / 0.08);
      }

      /* 7. Motion & accessibility */
      @keyframes neon-pulse {
        from {
          box-shadow: var(--shadow-card), 0 0 26px var(--neon-glow-purple);
        }
        to {
          box-shadow: var(--shadow-card), 0 0 52px var(--neon-glow-cyan);
        }
      }

      @keyframes neon-sheen {
        from {
          filter: drop-shadow(0 0 6px var(--neon-glow-cyan));
        }
        to {
          filter: drop-shadow(0 0 16px var(--neon-glow-magenta));
        }
      }

      :focus-visible {
        outline: 2px solid var(--neon-cyan);
        outline-offset: 2px;
        box-shadow: 0 0 14px var(--neon-glow-cyan);
      }

      #todo-input:focus-visible {
        border-color: var(--color-focus);
        box-shadow:
          0 0 0 3px var(--color-accent-ring),
          0 0 14px var(--neon-glow-cyan);
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }

        #add-btn:hover,
        #add-btn:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-card">
      <header>
        <h1>Todo List</h1>
        <p class="subtitle">Stay on top of your day</p>
      </header>

      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="What needs to be done?">
        <button id="add-btn" type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </main>

    <script>
      const todos = [];

      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        const todo = { id: Date.now(), text: trimmed, completed: false };
        todos.push(todo);
        return todo;
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;
        return todo;
      }

      function deleteTodo(id) {
        const index = todos.findIndex((t) => t.id === id);
        if (index === -1) return;
        return todos.splice(index, 1)[0];
      }

      const STORAGE_KEY = 'todos';

      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch {
          return [];
        }
      }

      function saveTodos(todos) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch {
          // Silently ignore storage errors
        }
      }

      function createTodoElement(todo, onToggle, onDelete) {
        const li = document.createElement('li');
        li.dataset.id = todo.id;
        li.className = 'todo-item';

        if (todo.completed) {
          li.classList.add('completed');
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.className = 'todo-checkbox';

        if (onToggle) {
          checkbox.addEventListener('change', () => {
            onToggle(todo.id);
          });
        }

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';

        if (onDelete) {
          deleteBtn.addEventListener('click', () => {
            onDelete(todo.id);
          });
        }

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        return li;
      }

      function renderTodos(onToggle, onDelete) {
        const list = document.getElementById('todo-list');
        if (!list) return;
        list.innerHTML = '';
        todos.forEach((todo) => {
          const li = createTodoElement(todo, onToggle, onDelete);
          list.appendChild(li);
        });
      }

      function handleToggle(id) {
        toggleTodo(id);
        saveTodos(todos);
        renderTodos(handleToggle, handleDelete);
      }

      function handleDelete(id) {
        deleteTodo(id);
        saveTodos(todos);
        renderTodos(handleToggle, handleDelete);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const loaded = loadTodos();
        if (loaded.length) todos.push(...loaded);

        const todoInput = document.getElementById("todo-input");
        const todoForm = document.getElementById("todo-form");

        todoForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const todo = addTodo(todoInput.value);
          if (todo) {
            todoInput.value = "";
            saveTodos(todos);
            renderTodos(handleToggle, handleDelete);
          }
        });

        renderTodos(handleToggle, handleDelete);
      });
    </script>
  </body>
</html>
