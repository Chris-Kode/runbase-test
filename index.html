<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos &amp; Notes</title>
    <style>
      /* 1. Design tokens — neon (dark-first) */
      :root {
        color-scheme: light dark;

        --color-bg-1: #e8ebff;
        --color-bg-2: #f5f3ff;
        --color-surface: #ffffff;
        --color-field: rgb(255 255 255 / 0.65);
        --color-border: #d9dcf3;
        --color-text: #10152b;
        --color-text-muted: #4b5170;
        --color-accent: #7c3aed;
        --color-accent-hover: #db2777;
        --color-accent-contrast: #0a0614;
        --color-accent-halo: rgb(124 58 237 / 0.16);
        --color-accent-soft: rgb(0 240 255 / 0.1);
        --color-accent-ring: rgb(124 58 237 / 0.3);
        --color-accent-glow: rgb(255 43 214 / 0.35);
        --color-danger: #e11d48;
        --color-danger-soft: rgb(225 29 72 / 0.12);
        --color-focus: #7c3aed;

        /* Neon palette */
        --neon-cyan: #00f0ff;
        --neon-magenta: #ff2bd6;
        --neon-purple: #a855f7;
        --neon-lime: #b6ff3d;
        --neon-danger: #ff3b6b;
        --neon-glow-cyan: rgb(0 240 255 / 0.55);
        --neon-glow-magenta: rgb(255 43 214 / 0.55);
        --neon-glow-purple: rgb(168 85 247 / 0.5);
        --neon-border: rgb(0 240 255 / 0.35);

        /* Ambient aurora layer (adapts in the dark-mode block) */
        --aurora-a: rgb(124 58 237 / 0.16);
        --aurora-b: rgb(255 43 214 / 0.55);

        --radius-card: 16px;
        --radius-control: 10px;
        --radius-row: 10px;

        --shadow-card:
          0 0 0 1px rgb(255 255 255 / 0.7) inset,
          0 1px 2px rgb(15 23 42 / 0.06),
          0 0 22px rgb(124 58 237 / 0.22),
          0 8px 30px rgb(15 23 42 / 0.1);
        --shadow-accent:
          0 0 0 1px rgb(255 255 255 / 0.25) inset,
          0 1px 2px rgb(124 58 237 / 0.4),
          0 0 16px var(--neon-glow-cyan),
          0 4px 14px rgb(255 43 214 / 0.35);

        --space-1: 0.5rem;
        --space-2: 0.75rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2rem;

        --speed: 150ms;

        /* Motion system */
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --dur-fast: 140ms;
        --dur-base: 240ms;
        --dur-slow: 420ms;
        --dur-reveal: 620ms;
        --stagger: 40ms;
      }

      /* 2. Reset / base */
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: var(--space-5) var(--space-3);
        display: grid;
        place-items: start center;
        background:
          radial-gradient(
            60rem 60rem at 120% -10%,
            var(--color-accent-halo),
            transparent 60%
          ),
          radial-gradient(
            40rem 40rem at -10% 110%,
            rgb(255 43 214 / 0.14),
            transparent 60%
          ),
          radial-gradient(
            28rem 28rem at 50% -5%,
            rgb(0 240 255 / 0.12),
            transparent 70%
          ),
          repeating-linear-gradient(
            0deg,
            rgb(0 240 255 / 0.06) 0 1px,
            transparent 1px 44px
          ),
          repeating-linear-gradient(
            90deg,
            rgb(0 240 255 / 0.06) 0 1px,
            transparent 1px 44px
          ),
          linear-gradient(160deg, var(--color-bg-1), var(--color-bg-2));
        color: var(--color-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* Ambient aurora: fixed, non-interactive, compositor-friendly */
      body::before {
        content: "";
        position: fixed;
        inset: -12%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            44rem 44rem at 28% 32%,
            var(--aurora-a),
            transparent 65%
          ),
          radial-gradient(
            38rem 38rem at 72% 68%,
            var(--aurora-b),
            transparent 65%
          );
        will-change: transform, opacity;
        animation: aurora-drift 34s var(--ease-in-out) infinite;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg-1: #05010d;
          --color-bg-2: #0a0618;
          --color-surface: rgb(20 10 40 / 0.72);
          --color-field: rgb(255 255 255 / 0.06);
          --color-border: rgb(0 240 255 / 0.18);
          --color-text: #eaf6ff;
          --color-text-muted: #9aa7c7;
          --color-accent: #00f0ff;
          --color-accent-hover: #ff2bd6;
          --color-accent-contrast: #05010d;
          --color-accent-halo: rgb(0 240 255 / 0.14);
          --color-accent-soft: rgb(0 240 255 / 0.1);
          --color-accent-ring: rgb(0 240 255 / 0.35);
          --color-accent-glow: rgb(0 240 255 / 0.45);
          --color-danger: #ff3b6b;
          --color-danger-soft: rgb(255 59 107 / 0.16);
          --color-focus: #00f0ff;

          --aurora-a: rgb(0 240 255 / 0.14);

          --shadow-card:
            0 0 0 1px rgb(0 240 255 / 0.14) inset,
            0 0 24px rgb(0 240 255 / 0.16),
            0 0 60px rgb(168 85 247 / 0.18),
            0 18px 50px rgb(0 0 0 / 0.6);
          --shadow-accent:
            0 0 0 1px rgb(255 255 255 / 0.2) inset,
            0 0 16px var(--neon-glow-cyan),
            0 0 34px var(--neon-glow-magenta),
            0 4px 14px rgb(0 0 0 / 0.5);
        }

        body {
          background:
            radial-gradient(
              60rem 60rem at 120% -10%,
              rgb(255 43 214 / 0.22),
              transparent 60%
            ),
            radial-gradient(
              42rem 42rem at -10% 110%,
              rgb(0 240 255 / 0.2),
              transparent 60%
            ),
            repeating-linear-gradient(
              0deg,
              rgb(0 240 255 / 0.08) 0 1px,
              transparent 1px 44px
            ),
            repeating-linear-gradient(
              90deg,
              rgb(0 240 255 / 0.08) 0 1px,
              transparent 1px 44px
            ),
            linear-gradient(160deg, var(--color-bg-1), var(--color-bg-2));
          text-shadow: 0 0 18px rgb(0 240 255 / 0.14);
        }
      }

      /* 3. Layout: shell, card, header */
      .app-card {
        width: 100%;
        max-width: 480px;
        margin-top: var(--space-5);
        padding: var(--space-4);
        background: var(--color-surface);
        border: 1px solid var(--neon-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card), 0 0 40px var(--neon-glow-purple);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        animation:
          card-enter var(--dur-reveal) var(--ease-out) both,
          neon-pulse 6s ease-in-out infinite alternate;
      }

      /* Non-blur fallback: keep the card opaque enough to stay legible. */
      @supports not ((backdrop-filter: blur(14px)) or (-webkit-backdrop-filter: blur(14px))) {
        .app-card {
          background: var(--color-bg-2);
        }
      }

      header {
        margin-bottom: var(--space-3);
        animation: card-enter var(--dur-reveal) var(--ease-out) both;
        animation-delay: var(--stagger);
      }

      h1 {
        margin: 0 0 var(--space-1);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(
          90deg,
          var(--neon-cyan),
          var(--neon-magenta),
          var(--neon-purple)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 8px var(--neon-glow-cyan));
        animation: neon-sheen 5s ease-in-out infinite alternate;
      }

      .subtitle {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 0.875rem;
      }

      /* 4. Form controls */
      #todo-form {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        animation: card-enter var(--dur-reveal) var(--ease-out) both;
        animation-delay: calc(var(--stagger) * 2);
      }

      #todo-input {
        flex: 1 1 16rem;
        min-width: 0;
        padding: 0.6rem var(--space-3);
        background: var(--color-field);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        font: inherit;
        transition:
          border-color var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      #todo-input::placeholder {
        color: var(--color-text-muted);
      }

      #add-btn {
        position: relative;
        overflow: hidden;
        padding: 0.6rem 1rem;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
        color: var(--color-accent-contrast);
        border: none;
        border-radius: var(--radius-control);
        box-shadow: var(--shadow-accent), 0 0 18px var(--neon-glow-cyan);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out),
          filter var(--dur-base) var(--ease-out);
      }

      /* Sheen sweep on hover (pointer devices only) */
      #add-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 20%,
          rgb(255 255 255 / 0.55) 50%,
          transparent 80%
        );
        transform: translateX(-120%);
        transition: transform var(--dur-slow) var(--ease-out);
        pointer-events: none;
      }

      @media (hover: hover) and (pointer: fine) {
        #add-btn:hover::after {
          transform: translateX(120%);
        }
      }

      #add-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: var(--shadow-accent), 0 0 28px var(--neon-glow-magenta);
      }

      #add-btn:active {
        transform: translateY(0);
        filter: brightness(0.96);
        box-shadow: var(--shadow-accent);
      }

      /* 5. Todo list & items */
      #todo-list {
        margin: var(--space-2) 0 0;
        padding: 0;
        list-style: none;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-1);
        border-radius: var(--radius-row);
        border-bottom: 1px solid var(--color-border);
        border-left: 3px solid transparent;
        transition:
          background-color var(--speed) ease,
          box-shadow var(--speed) ease,
          border-color var(--speed) ease;
      }

      .todo-item:hover {
        background: var(--color-accent-soft);
        border-left-color: var(--neon-cyan);
        box-shadow: inset 0 0 18px rgb(0 240 255 / 0.12);
      }

      .todo-item:last-child {
        border-bottom: none;
      }

      .todo-item.is-entering {
        contain: paint;
        animation: row-enter var(--dur-base) var(--ease-out) both;
        animation-delay: var(--row-delay, 0ms);
      }

      .todo-item.just-toggled {
        animation: row-glow var(--dur-slow) var(--ease-out);
      }

      /* Declared after .just-toggled so a row deleted during the glow window
         still plays row-leave instead of silently keeping row-glow. */
      .todo-item.is-leaving {
        overflow: hidden;
        pointer-events: none;
        animation: row-leave var(--dur-base) var(--ease-in-out) forwards;
      }

      .todo-checkbox {
        flex-shrink: 0;
        width: 1.2rem;
        height: 1.2rem;
        margin: 0;
        accent-color: var(--neon-cyan);
        cursor: pointer;
        transition:
          transform var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      .todo-checkbox:checked {
        transform: scale(1.1);
        box-shadow: 0 0 10px var(--neon-lime);
        animation: check-pop var(--dur-base) var(--ease-spring);
      }

      .todo-text {
        flex: 1;
        min-width: 0;
        word-break: break-word;
        background-image: linear-gradient(currentColor, currentColor);
        background-repeat: no-repeat;
        background-position: 0 60%;
        background-size: 0% 2px;
        transition:
          opacity var(--speed) ease,
          background-size var(--dur-slow) var(--ease-out);
      }

      /* The sweep replaces the static line-through so only one line renders. */
      .todo-item.completed .todo-text {
        color: var(--color-text-muted);
        opacity: 0.9;
        background-size: 100% 2px;
      }

      .delete-btn {
        flex-shrink: 0;
        width: 2rem;
        height: 2rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        background: transparent;
        color: var(--color-text-muted);
        border: none;
        border-radius: 50%;
        font: inherit;
        line-height: 1;
        cursor: pointer;
        transition:
          color var(--speed) ease,
          background-color var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      .delete-btn:hover {
        background: var(--color-danger-soft);
        color: var(--color-danger);
        box-shadow: 0 0 12px var(--neon-danger);
      }

      /* 6. Empty state (pure CSS — the <ul> stays whitespace-free) */
      #todo-list:empty {
        margin: 0;
      }

      #todo-list:empty::after {
        content: "No todos yet — add one above ✨";
        display: block;
        padding: var(--space-4) var(--space-1);
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.875rem;
        border: 1px dashed var(--neon-border);
        border-radius: var(--radius-control);
        box-shadow: inset 0 0 24px rgb(0 240 255 / 0.08);
        animation: empty-enter var(--dur-reveal) var(--ease-out) both;
      }

      /* 7. Notes page & view tabs */
      .view-tabs {
        display: flex;
        gap: var(--space-1);
        margin-bottom: var(--space-3);
        border-bottom: 1px solid var(--color-border);
        animation: card-enter var(--dur-reveal) var(--ease-out) both;
        animation-delay: calc(var(--stagger) * 3);
      }

      .view-tab {
        padding: 0.5rem var(--space-3);
        background: transparent;
        color: var(--color-text-muted);
        border: none;
        border-radius: var(--radius-control);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          color var(--dur-base) var(--ease-out),
          background-color var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out);
      }

      .view-tab:hover {
        color: var(--color-text);
        background: var(--color-accent-soft);
      }

      .view-tab.is-active {
        color: var(--color-accent-contrast);
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
        box-shadow: var(--shadow-accent);
      }

      #note-form {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        animation: card-enter var(--dur-reveal) var(--ease-out) both;
        animation-delay: calc(var(--stagger) * 2);
      }

      #note-input,
      #tag-input {
        padding: 0.6rem var(--space-3);
        background: var(--color-field);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        font: inherit;
        transition:
          border-color var(--speed) ease,
          box-shadow var(--speed) ease;
      }

      #note-input {
        flex: 1 1 100%;
        min-height: 4.5rem;
        resize: vertical;
      }

      #tag-input {
        flex: 1 1 12rem;
        min-width: 0;
      }

      #note-input::placeholder,
      #tag-input::placeholder {
        color: var(--color-text-muted);
      }

      #note-input:focus-visible,
      #tag-input:focus-visible {
        border-color: var(--color-focus);
        box-shadow:
          0 0 0 3px var(--color-accent-ring),
          0 0 14px var(--neon-glow-cyan);
        outline: none;
      }

      #add-note-btn {
        position: relative;
        overflow: hidden;
        padding: 0.6rem 1rem;
        background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
        color: var(--color-accent-contrast);
        border: none;
        border-radius: var(--radius-control);
        box-shadow: var(--shadow-accent), 0 0 18px var(--neon-glow-cyan);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out),
          filter var(--dur-base) var(--ease-out);
      }

      #add-note-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: var(--shadow-accent), 0 0 28px var(--neon-glow-magenta);
      }

      #add-note-btn:active {
        transform: translateY(0);
        filter: brightness(0.96);
        box-shadow: var(--shadow-accent);
      }

      #notes-list {
        margin: var(--space-2) 0 0;
        padding: 0;
        list-style: none;
      }

      .note-item {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: var(--space-1);
        padding: var(--space-2) var(--space-3);
        padding-right: calc(var(--space-3) + 1.75rem);
        background: var(--color-accent-soft);
        border: 1px solid var(--color-border);
        border-left: 3px solid transparent;
        border-radius: var(--radius-row);
        transition:
          background-color var(--speed) ease,
          box-shadow var(--speed) ease,
          border-color var(--speed) ease;
      }

      .note-item + .note-item {
        margin-top: var(--space-1);
      }

      .note-item:hover {
        border-left-color: var(--neon-cyan);
        box-shadow: inset 0 0 18px rgb(0 240 255 / 0.12);
      }

      .note-item.is-entering {
        contain: paint;
        animation: row-enter var(--dur-base) var(--ease-out) both;
        animation-delay: var(--row-delay, 0ms);
      }

      .note-item.is-leaving {
        overflow: hidden;
        pointer-events: none;
        animation: row-leave var(--dur-base) var(--ease-in-out) forwards;
      }

      .note-text {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .note-tags {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .tag-chip {
        padding: 0.15rem 0.6rem;
        background: var(--color-accent-soft);
        color: var(--color-accent);
        border: 1px solid var(--neon-cyan);
        border-radius: 999px;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .note-item .delete-btn {
        position: absolute;
        top: var(--space-1);
        right: var(--space-1);
      }

      #notes-list:empty {
        margin: 0;
      }

      #notes-list:empty::after {
        content: "No notes yet — write one above 📝";
        display: block;
        padding: var(--space-4) var(--space-1);
        text-align: center;
        color: var(--color-text-muted);
        font-size: 0.875rem;
        border: 1px dashed var(--neon-border);
        border-radius: var(--radius-control);
        box-shadow: inset 0 0 24px rgb(0 240 255 / 0.08);
        animation: empty-enter var(--dur-reveal) var(--ease-out) both;
      }

      /* 8. Motion & accessibility */
      @keyframes neon-pulse {
        from {
          box-shadow: var(--shadow-card), 0 0 26px var(--neon-glow-purple);
        }
        to {
          box-shadow: var(--shadow-card), 0 0 52px var(--neon-glow-cyan);
        }
      }

      @keyframes neon-sheen {
        from {
          filter: drop-shadow(0 0 6px var(--neon-glow-cyan));
        }
        to {
          filter: drop-shadow(0 0 16px var(--neon-glow-magenta));
        }
      }

      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }

      @keyframes row-enter {
        from {
          opacity: 0;
          transform: translateX(-10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes row-leave {
        from {
          opacity: 1;
          max-height: 6rem;
          transform: translateX(0);
        }
        to {
          opacity: 0;
          max-height: 0;
          padding-top: 0;
          padding-bottom: 0;
          transform: translateX(14px);
        }
      }

      @keyframes check-pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.25);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes row-glow {
        0% {
          box-shadow: 0 0 0 0 var(--neon-glow-cyan);
        }
        40% {
          box-shadow: 0 0 18px 2px var(--neon-glow-cyan);
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @keyframes empty-enter {
        from {
          opacity: 0;
          transform: scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes aurora-drift {
        0% {
          opacity: 0.55;
          transform: translate3d(-3%, -2%, 0) scale(1);
        }
        50% {
          opacity: 0.9;
          transform: translate3d(3%, 3%, 0) scale(1.08);
        }
        100% {
          opacity: 0.55;
          transform: translate3d(-3%, -2%, 0) scale(1);
        }
      }

      @keyframes focus-breathe {
        from {
          box-shadow: 0 0 10px var(--neon-glow-cyan);
        }
        to {
          box-shadow: 0 0 20px var(--neon-glow-magenta);
        }
      }

      .delete-btn:focus-visible,
      #add-btn:focus-visible,
      #add-note-btn:focus-visible {
        animation: focus-breathe 2.4s var(--ease-in-out) infinite alternate;
      }

      :focus-visible {
        outline: 2px solid var(--neon-cyan);
        outline-offset: 2px;
        box-shadow: 0 0 14px var(--neon-glow-cyan);
      }

      #todo-input:focus-visible {
        border-color: var(--color-focus);
        box-shadow:
          0 0 0 3px var(--color-accent-ring),
          0 0 14px var(--neon-glow-cyan);
        outline: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }

        #add-btn:hover,
        #add-btn:active,
        #add-note-btn:hover,
        #add-note-btn:active {
          transform: none;
        }

        #add-btn:hover::after {
          transform: translateX(-120%);
        }

        /* Content always resolves to its final, visible state. */
        .todo-item.is-entering,
        .todo-item.is-leaving,
        .note-item.is-entering,
        .note-item.is-leaving {
          opacity: 1;
          transform: none;
        }

        /* No sweep transition: fall back to a plain strikethrough. */
        .todo-item.completed .todo-text {
          background-size: 0% 2px;
          text-decoration: line-through;
          text-decoration-color: var(--neon-magenta);
          text-decoration-thickness: 2px;
        }
      }

    </style>
  </head>
  <body>
    <main class="app-card">
      <header>
        <h1 id="app-title">Todos</h1>
        <p class="subtitle" id="app-subtitle">Stay on top of your day</p>
      </header>

      <nav class="view-tabs" role="tablist" aria-label="Views">
        <button class="view-tab is-active" id="tab-todos" role="tab"
                aria-selected="true" aria-controls="todos-view" tabindex="0" type="button">Todos</button>
        <button class="view-tab" id="tab-notes" role="tab"
                aria-selected="false" aria-controls="notes-view" tabindex="-1" type="button">Notes</button>
      </nav>

      <section id="todos-view" role="tabpanel" aria-labelledby="tab-todos" tabindex="0">
        <form id="todo-form">
          <input id="todo-input" type="text" placeholder="What needs to be done?">
          <button id="add-btn" type="submit">Add</button>
        </form>
        <ul id="todo-list"></ul>
      </section>

      <section id="notes-view" role="tabpanel" aria-labelledby="tab-notes" tabindex="0" hidden>
        <form id="note-form">
          <textarea id="note-input" rows="3" placeholder="Write a note…"></textarea>
          <input id="tag-input" type="text" placeholder="tags, separated by commas or spaces">
          <button id="add-note-btn" type="submit">Add note</button>
        </form>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <script>
      const todos = [];

      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        const todo = { id: Date.now(), text: trimmed, completed: false };
        todos.push(todo);
        return todo;
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;
        return todo;
      }

      function deleteTodo(id) {
        const index = todos.findIndex((t) => t.id === id);
        if (index === -1) return;
        return todos.splice(index, 1)[0];
      }

      const STORAGE_KEY = 'todos';

      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch {
          return [];
        }
      }

      function saveTodos(todos) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch {
          // Silently ignore storage errors
        }
      }

      const notes = [];
      const NOTES_KEY = 'notes';
      const MAX_TAGS = 8;
      const MAX_TAG_LENGTH = 24;
      let idCounter = 0;

      function nextId() {
        // Combine the clock with a counter so rapid adds cannot collide.
        return Date.now() * 1000 + (idCounter++ % 1000);
      }

      function parseTags(raw) {
        const seen = new Set();
        const tags = [];
        for (const part of String(raw).split(/[,\s]+/)) {
          const tag = part.trim().toLowerCase().slice(0, MAX_TAG_LENGTH);
          if (!tag || seen.has(tag)) continue;
          seen.add(tag);
          tags.push(tag);
          if (tags.length >= MAX_TAGS) break;
        }
        return tags;
      }

      function addNote(text, rawTags) {
        const trimmed = String(text).trim();
        if (!trimmed) return null;
        const note = {
          id: nextId(),
          text: trimmed,
          tags: parseTags(rawTags),
          createdAt: Date.now(),
        };
        notes.push(note);
        return note;
      }

      function deleteNote(id) {
        const index = notes.findIndex((n) => n.id === id);
        if (index === -1) return undefined;
        return notes.splice(index, 1)[0];
      }

      function loadNotes() {
        try {
          const raw = localStorage.getItem(NOTES_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter((note) => note && typeof note.text === 'string')
            .map((note) => ({
              id:
                typeof note.id === 'number' && Number.isFinite(note.id)
                  ? note.id
                  : nextId(),
              text: note.text,
              tags: Array.isArray(note.tags)
                ? note.tags.filter((tag) => typeof tag === 'string' && tag.trim())
                : [],
              createdAt: note.createdAt,
            }));
        } catch {
          return [];
        }
      }

      function saveNotes(list) {
        try {
          localStorage.setItem(NOTES_KEY, JSON.stringify(list));
        } catch {
          // Silently ignore storage errors
        }
      }

      function createTodoElement(todo, onToggle, onDelete, options = {}) {
        const li = document.createElement('li');
        li.dataset.id = todo.id;
        li.className = 'todo-item';

        if (todo.completed) {
          li.classList.add('completed');
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.className = 'todo-checkbox';

        if (onToggle) {
          checkbox.addEventListener('change', () => {
            onToggle(todo.id);
          });
        }

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';

        if (onDelete) {
          deleteBtn.addEventListener('click', () => {
            onDelete(todo.id);
          });
        }

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        if (options.entering) {
          const delay = Number.isFinite(options.delay) ? options.delay : 0;
          li.classList.add('is-entering');
          li.style.setProperty('--row-delay', `${delay}ms`);
          // Child animations (e.g. check-pop) bubble, so ignore anything that
          // is not this row's own entrance animation.
          const onRowEnterEnd = (event) => {
            if (event.target !== li || event.animationName !== 'row-enter') return;
            li.removeEventListener('animationend', onRowEnterEnd);
            li.classList.remove('is-entering');
            li.style.removeProperty('--row-delay');
          };
          li.addEventListener('animationend', onRowEnterEnd);
        }

        return li;
      }

      const STAGGER_MS = 40;
      const STAGGER_CAP = 8;

      function renderTodos(onToggle, onDelete, entering) {
        const list = document.getElementById('todo-list');
        if (!list) return;
        list.innerHTML = '';
        todos.forEach((todo, index) => {
          const shouldEnter = entering instanceof Set && entering.has(todo.id);
          const delay = Math.min(index, STAGGER_CAP) * STAGGER_MS;
          const li = createTodoElement(todo, onToggle, onDelete, {
            entering: shouldEnter,
            delay,
          });
          list.appendChild(li);
        });
      }

      function createNoteElement(note, onDelete, options = {}) {
        const li = document.createElement('li');
        li.dataset.id = note.id;
        li.className = 'note-item';

        const p = document.createElement('p');
        p.className = 'note-text';
        p.textContent = note.text;

        const tags = document.createElement('ul');
        tags.className = 'note-tags';
        (note.tags || []).forEach((tag) => {
          const chip = document.createElement('li');
          chip.className = 'tag-chip';
          chip.textContent = '#' + tag;
          tags.appendChild(chip);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', 'Delete note');

        if (onDelete) {
          deleteBtn.addEventListener('click', () => {
            onDelete(note.id);
          });
        }

        li.appendChild(p);
        if (note.tags && note.tags.length) li.appendChild(tags);
        li.appendChild(deleteBtn);

        if (options.entering) {
          const delay = Number.isFinite(options.delay) ? options.delay : 0;
          li.classList.add('is-entering');
          li.style.setProperty('--row-delay', `${delay}ms`);
          const onRowEnterEnd = (event) => {
            if (event.target !== li || event.animationName !== 'row-enter') return;
            li.removeEventListener('animationend', onRowEnterEnd);
            li.classList.remove('is-entering');
            li.style.removeProperty('--row-delay');
          };
          li.addEventListener('animationend', onRowEnterEnd);
        }

        return li;
      }

      function renderNotes(onDelete, entering) {
        const list = document.getElementById('notes-list');
        if (!list) return;
        list.innerHTML = '';
        notes.forEach((note, index) => {
          const shouldEnter = entering instanceof Set && entering.has(note.id);
          const delay = Math.min(index, STAGGER_CAP) * STAGGER_MS;
          const li = createNoteElement(note, onDelete, {
            entering: shouldEnter,
            delay,
          });
          list.appendChild(li);
        });
      }

      function prefersReducedMotion() {
        return (
          typeof window !== 'undefined' &&
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches
        );
      }

      function handleToggle(id) {
        const todo = toggleTodo(id);
        saveTodos(todos);
        if (!todo) return;

        const li = document.querySelector(`.todo-item[data-id="${id}"]`);
        if (!li) {
          renderTodos(handleToggle, handleDelete);
          return;
        }

        li.classList.toggle('completed', todo.completed);
        const checkbox = li.querySelector('.todo-checkbox');
        if (checkbox) checkbox.checked = todo.completed;

        // Replay the glow on repeated toggles with one forced reflow.
        li.classList.remove('just-toggled');
        void li.offsetWidth;
        li.classList.add('just-toggled');
        const onGlowEnd = (event) => {
          if (event.target !== li || event.animationName !== 'row-glow') return;
          li.removeEventListener('animationend', onGlowEnd);
          li.classList.remove('just-toggled');
        };
        li.addEventListener('animationend', onGlowEnd);
      }

      function animateRowRemoval(li, finalize) {
        if (li && li.dataset.leaving === '1') return;
        if (!li || prefersReducedMotion()) {
          finalize();
          return;
        }

        li.dataset.leaving = '1';
        let done = false;
        const settle = (event) => {
          // Only the row's own row-leave completion may finalize; child
          // animations bubble and must not settle the row early.
          if (event && (event.target !== li || event.animationName !== 'row-leave')) {
            return;
          }
          if (done) return;
          done = true;
          li.removeEventListener('animationend', settle);
          finalize();
        };

        li.classList.add('is-leaving');
        li.addEventListener('animationend', settle);
        window.setTimeout(settle, 400);
      }

      function handleDelete(id) {
        const li = document.querySelector(`.todo-item[data-id="${id}"]`);
        animateRowRemoval(li, () => {
          deleteTodo(id);
          saveTodos(todos);
          renderTodos(handleToggle, handleDelete);
        });
      }

      function handleDeleteNote(id) {
        const li = document.querySelector(`.note-item[data-id="${id}"]`);
        animateRowRemoval(li, () => {
          deleteNote(id);
          saveNotes(notes);
          renderNotes(handleDeleteNote);
        });
      }

      function setView(view, syncHash = true) {
        const isNotes = view === 'notes';
        const todosView = document.getElementById('todos-view');
        const notesView = document.getElementById('notes-view');
        const tabTodos = document.getElementById('tab-todos');
        const tabNotes = document.getElementById('tab-notes');

        if (todosView) todosView.hidden = isNotes;
        if (notesView) notesView.hidden = !isNotes;

        if (tabTodos) {
          tabTodos.setAttribute('aria-selected', String(!isNotes));
          tabTodos.classList.toggle('is-active', !isNotes);
          tabTodos.tabIndex = isNotes ? -1 : 0;
        }
        if (tabNotes) {
          tabNotes.setAttribute('aria-selected', String(isNotes));
          tabNotes.classList.toggle('is-active', isNotes);
          tabNotes.tabIndex = isNotes ? 0 : -1;
        }

        const title = document.getElementById('app-title');
        const subtitle = document.getElementById('app-subtitle');
        if (title) title.textContent = isNotes ? 'Notes' : 'Todos';
        if (subtitle) {
          subtitle.textContent = isNotes ? 'Jot things down' : 'Stay on top of your day';
        }
        document.title = isNotes ? 'Notes' : 'Todos';

        // Keep the URL in sync so tabs stay bookmarkable/back-button friendly.
        if (syncHash) {
          const hash = isNotes ? '#notes' : '#todos';
          if (window.location.hash !== hash) window.location.hash = hash;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const loaded = loadTodos();
        if (loaded.length) todos.push(...loaded);

        const loadedNotes = loadNotes();
        if (loadedNotes.length) notes.push(...loadedNotes);

        const todoInput = document.getElementById("todo-input");
        const todoForm = document.getElementById("todo-form");
        const noteForm = document.getElementById("note-form");
        const noteInput = document.getElementById("note-input");
        const tagInput = document.getElementById("tag-input");

        todoForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const todo = addTodo(todoInput.value);
          if (todo) {
            todoInput.value = "";
            saveTodos(todos);
            renderTodos(handleToggle, handleDelete, new Set([todo.id]));
          }
        });

        if (noteForm) {
          noteForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const note = addNote(noteInput.value, tagInput.value);
            if (note) {
              noteInput.value = "";
              tagInput.value = "";
              saveNotes(notes);
              renderNotes(handleDeleteNote, new Set([note.id]));
            }
          });
        }

        const tabTodos = document.getElementById("tab-todos");
        const tabNotes = document.getElementById("tab-notes");
        const tabs = [tabTodos, tabNotes].filter(Boolean);

        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            setView(tab === tabNotes ? "notes" : "todos");
          });
          tab.addEventListener("keydown", (event) => {
            const index = tabs.indexOf(tab);
            let next = null;
            if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
            else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = tabs.length - 1;
            if (next === null) return;
            event.preventDefault();
            tabs[next].focus();
            setView(next === 1 ? "notes" : "todos");
          });
        });

        window.addEventListener("hashchange", () => {
          setView(window.location.hash === "#notes" ? "notes" : "todos", false);
        });

        setView(window.location.hash === "#notes" ? "notes" : "todos", false);
        renderTodos(handleToggle, handleDelete, new Set(todos.map((t) => t.id)));
        renderNotes(handleDeleteNote, new Set(notes.map((n) => n.id)));
      });
    </script>
  </body>
</html>
