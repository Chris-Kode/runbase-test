<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #todo-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      #todo-input {
        flex: 1 1 16rem;
        min-width: 0;
        padding: 0.6rem;
        font: inherit;
      }

      #add-btn {
        padding: 0.6rem 1rem;
        font: inherit;
        cursor: pointer;
      }

      #todo-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }

      .todo-checkbox {
        flex-shrink: 0;
        width: 1.2rem;
        height: 1.2rem;
        cursor: pointer;
      }

      .todo-text {
        flex: 1;
        min-width: 0;
        word-break: break-word;
      }

      .todo-item.completed .todo-text {
        text-decoration: line-through;
        color: #999;
      }

      .delete-btn {
        flex-shrink: 0;
        padding: 0.3rem 0.5rem;
        border: none;
        background: transparent;
        color: #999;
        font: inherit;
        cursor: pointer;
      }

      .delete-btn:hover {
        color: #e33;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Todo List</h1>
    </header>

    <main>
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="What needs to be done?">
        <button id="add-btn" type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
    </main>

    <script>
      const todos = [];

      function addTodo(text) {
        const trimmed = text.trim();
        if (!trimmed) return;
        const todo = { id: Date.now(), text: trimmed, completed: false };
        todos.push(todo);
        return todo;
      }

      function toggleTodo(id) {
        const todo = todos.find((t) => t.id === id);
        if (!todo) return;
        todo.completed = !todo.completed;
        return todo;
      }

      function deleteTodo(id) {
        const index = todos.findIndex((t) => t.id === id);
        if (index === -1) return;
        return todos.splice(index, 1)[0];
      }

      const STORAGE_KEY = 'todos';

      function loadTodos() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed;
        } catch {
          return [];
        }
      }

      function saveTodos(todos) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        } catch {
          // Silently ignore storage errors
        }
      }

      function createTodoElement(todo, onToggle, onDelete) {
        const li = document.createElement('li');
        li.dataset.id = todo.id;
        li.className = 'todo-item';

        if (todo.completed) {
          li.classList.add('completed');
        }

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.className = 'todo-checkbox';

        if (onToggle) {
          checkbox.addEventListener('change', () => {
            onToggle(todo.id);
          });
        }

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';

        if (onDelete) {
          deleteBtn.addEventListener('click', () => {
            onDelete(todo.id);
          });
        }

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);

        return li;
      }

      function renderTodos(onToggle, onDelete) {
        const list = document.getElementById('todo-list');
        if (!list) return;
        list.innerHTML = '';
        todos.forEach((todo) => {
          const li = createTodoElement(todo, onToggle, onDelete);
          list.appendChild(li);
        });
      }

      function handleToggle(id) {
        toggleTodo(id);
        saveTodos(todos);
        renderTodos(handleToggle, handleDelete);
      }

      function handleDelete(id) {
        deleteTodo(id);
        saveTodos(todos);
        renderTodos(handleToggle, handleDelete);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const loaded = loadTodos();
        if (loaded.length) todos.push(...loaded);

        const todoInput = document.getElementById("todo-input");
        const todoForm = document.getElementById("todo-form");

        todoForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const todo = addTodo(todoInput.value);
          if (todo) {
            todoInput.value = "";
            saveTodos(todos);
            renderTodos(handleToggle, handleDelete);
          }
        });

        renderTodos(handleToggle, handleDelete);
      });
    </script>
  </body>
</html>
