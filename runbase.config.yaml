   automations:
     - name: triage-issues
       on:
         issue:
           action: labeled
           labels:
             - bug
       run:
         provider: my-provider
         model: meta/muse-spark-1.2-contributor
         thinking: high
         prompt: |
           Review issue #{{ issue.number }}: {{ issue.title }}.
           Body: {{ issue.body }}
           Filed by {{ issue.author }}.
           Classify the bug severity and suggest next steps.

     - name: review-pr
       on:
         pull_request:
           action: opened
       run:
         provider: my-provider
         model: meta/muse-spark-1.2-contributor
         thinking: high
         prompt: |
           Review PR #{{ pull_request.number }}: {{ pull_request.title }}.
           Check correctness, tests, and style. List findings by priority.

     - name: final-check
       on:
         pull_request:
           action: ready_for_review
       run:
         provider: openai-codex
         model: meta/muse-spark-1.2-contributor
         thinking: high
         prompt: |
             Summarize changes in PR #{{ pull_request.number }} in one paragraph.
