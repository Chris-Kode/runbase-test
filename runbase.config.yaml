automations:
  - name: implement-issue
    on:
      issue:
        action: opened
        labels:
          - ready_to_implement
    run:
      provider: my-provider
      model: meta/muse-spark-1.3-contributor
      thinking: high
      prompt: |
        Implement the issue #{{ issue.number }}: {{ issue.title }}.
        Body: {{ issue.body }}
        Filed by {{ issue.author }}.
        Make the code changes. Keep the change small.
    delivery:
      type: pull_request
      merge:
        mode: automatic
        method: squash

  - name: final-check
    on:
      pull_request:
        action: ready_for_review
    run:
      provider: my-provider
      model: meta/muse-spark-1.3-contributor
      thinking: high
      prompt: |
        Summarize changes in PR #{{ pull_request.number }} in one paragraph.
    delivery:
      type: comment
