run:
  ai:
    provider: ollama-local
    model: deepseek-v4.1-flash
    thinking: xhigh
  sandbox:
    provider: vercel-provider
    config:
      vcpu: 2
  timeout: 7200

# Delivery Labels name a target. `issue` is the triggering issue.
# `pull_request` is the pull request the Delivery publishes.
automations:
  # Step 1 — plan the issue.
  - name: plan
    on:
      issue:
        action: labeled
        labels: [rb-ready-to-plan]
        blocked: false
    run:
      prompt: >-
        Write the technical plan for issue {{ issue.number }}: {{ issue.title }}.

        Original issue body:

        {{ issue.body }}

        Read the issue comments first. Produce a step-by-step technical plan:
        files to touch, changes per file, and a test plan.
    delivery:
      type: comment
      labels:
        issue: [rb-ready-to-code]

  # Step 2 — implement the plan and open the pull request.
  - name: implement
    on:
      issue:
        action: labeled
        labels: [rb-ready-to-plan, rb-ready-to-code]
        blocked: false
    run:
      prompt: >-
        Implement issue {{ issue.number }}: {{ issue.title }}.

        Original issue body:

        {{ issue.body }}

        Read the plan from the issue comments. Implement it test-first.

    delivery:
      type: pull_request
      merge:
        mode: manual
      labels:
        # The PR target is the pull request Runbase publishes for this issue.
        pull_request: [rb-ready-to-review]

  # Step 3 — review the implementation.
  - name: review
    on:
      pull_request:
        action: labeled
        labels: [rb-ready-to-review]
    run:
      # This Automation overrides the root thinking level only. It keeps the
      # root AI Provider and model.
      prompt: >-
        Review pull request {{ pull_request.number }}: {{ pull_request.title }}.

        Pull request body:

        {{ pull_request.body }}

        Check the diff against the linked issue spec and against the coding
        standards. Verify every spec item is done and every
        quality gate passes. Output a review with the findings and
        the verdict for both gates.
    delivery:
      type: comment
      labels:
        pull_request: [rb-ready-to-fix]

  # Step 4 — fix per the review comments, then auto-merge.
  - name: fix
    on:
      pull_request:
        action: labeled
        labels: [rb-ready-to-review, rb-ready-to-fix]
    run:
      prompt: >-
        Fix pull request {{ pull_request.number }}: {{ pull_request.title }}.

        Pull request body:

        {{ pull_request.body }}

        Read the review comments. Apply every requested fix depending of priority. Following the
        coding standards.
    delivery:
      type: pull_request
      merge:
        mode: automatic
        method: merge
